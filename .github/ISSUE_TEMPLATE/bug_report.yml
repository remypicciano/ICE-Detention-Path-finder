name: Bug report
description: Report a bug in ICE Detention Pathway
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Before you start, please
        search existing issues — the problem may already be known.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Include the exact identifier(s) used and the command or GUI steps.
        Prefer fabricated identifiers (e.g. `UFAKE-0001`) if you can reproduce
        without real data.
      placeholder: |
        1. Run `python ice_detention_pathway.py <identifier>`
        2. ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and how you installed (pip, desktop build, from source).
      value: |
        - OS:
        - Python version:
        - Install method:
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Does this report involve real identifiers or datasets?
      description: >
        Never post real identifiers, generated pathways for real people, or
        datasets in a public issue. If the report depends on real data, note the
        dataset version instead and we'll ask you to share details privately.
      options:
        - "No — I can reproduce with fabricated data"
        - "Yes — real identifiers involved (I will not post them publicly)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: Paste relevant output, redacting any real identifiers.
    validations:
      required: false
