name: Build desktop applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - macos-15-intel
          - ubuntu-22.04
          - ubuntu-22.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Linux GUI test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tk xvfb

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify Tk and run tests
        run: |
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python -m pytest -q

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean ICEDetentionPathway.spec

      - name: Test bundled macOS application
        if: runner.os == 'macOS'
        run: dist/ICEDetentionPathway.app/Contents/MacOS/ICEDetentionPathway --self-test

      - name: Test bundled Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\ICEDetentionPathway.exe" `
            -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Bundled self-test failed with exit code $($process.ExitCode)"
          }

      - name: Test bundled Linux application
        if: runner.os == 'Linux'
        run: |
          dist/ICEDetentionPathway --self-test
          xvfb-run --auto-servernum dist/ICEDetentionPathway --gui-self-test

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/ICEDetentionPathway.app \
            dist/ICEDetentionPathway-v${{ env.APP_VERSION }}-macOS-${{ runner.arch }}.zip

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\ICEDetentionPathway.exe" `
            -DestinationPath "dist\ICEDetentionPathway-v${{ env.APP_VERSION }}-Windows.zip"

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          architecture="$(uname -m)"
          tar -C dist -czf "ICEDetentionPathway-v${{ env.APP_VERSION }}-Linux-${architecture}.tar.gz" \
            ICEDetentionPathway

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ICEDetentionPathway-v${{ env.APP_VERSION }}-macOS-${{ runner.arch }}
          path: dist/ICEDetentionPathway-v${{ env.APP_VERSION }}-macOS-${{ runner.arch }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ICEDetentionPathway-v${{ env.APP_VERSION }}-Windows
          path: dist/ICEDetentionPathway-v${{ env.APP_VERSION }}-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ICEDetentionPathway-v${{ env.APP_VERSION }}-Linux-${{ runner.arch }}
          path: ICEDetentionPathway-v${{ env.APP_VERSION }}-Linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ICE Detention Pathway $TAG" \
            --generate-notes \
            || gh release upload "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --clobber
