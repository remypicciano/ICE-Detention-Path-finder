[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-detention-pathway"
version = "2.0.0"
description = "Reconstruct recorded ICE detention pathways from Deportation Data Project identifiers."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rémy Picciano" },
]
dependencies = [
  "duckdb==1.5.4",
  "pyarrow==25.0.0",
  "pytz==2026.2",
]

[project.optional-dependencies]
dev = [
  "pyinstaller==6.21.0",
  "pytest==9.1.1",
]

[project.scripts]
ice-detention-pathway = "ice_detention_pathway:main"
ice-detention-pathway-gui = "ice_detention_pathway_gui:main"
parquet-viewer = "parquet_viewer:main"

[project.urls]
Homepage = "https://github.com/remypicciano/ice_query"
Issues = "https://github.com/remypicciano/ice_query/issues"
Documentation = "https://github.com/remypicciano/ice_query#readme"
Data = "https://deportationdata.org/data/processed/ice.html"

[tool.setuptools]
py-modules = [
  "ice_detention_pathway",
  "ice_detention_pathway_gui",
  "nyc_filter",
  "parquet_viewer",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
