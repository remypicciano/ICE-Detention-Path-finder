[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-detention-pathway"
version = "3.1.0"
description = "Reconstruct recorded ICE detention pathways from Deportation Data Project identifiers."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rémy Picciano" },
]
dependencies = [
  "duckdb==1.5.5",
  "pyarrow==25.0.0",
  "pytz==2026.3.post1",
]

[project.optional-dependencies]
dev = [
  "pyinstaller==6.21.0",
  "pytest==9.1.1",
  "ruff==0.16.1",
  "mypy==2.3.0",
]

[project.scripts]
ice-detention-pathway = "ice_detention_pathway:main"
ice-detention-pathway-gui = "ice_detention_pathway_gui:main"
parquet-viewer = "parquet_viewer:main"

[project.urls]
Homepage = "https://github.com/remypicciano/ICE-Detention-Path-finder"
Issues = "https://github.com/remypicciano/ICE-Detention-Path-finder/issues"
Documentation = "https://github.com/remypicciano/ICE-Detention-Path-finder#readme"
Data = "https://deportationdata.org/data/processed/ice.html"

[tool.setuptools]
py-modules = [
  "ice_detention_pathway",
  "ice_detention_pathway_gui",
  "verify_pathway",
  "parquet_viewer",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
src = ["."]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ISC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ice_detention_pathway.py", "fetch_data.py", "verify_bulk.py", "q.py"]
[[tool.mypy.overrides]]
module = ["pyarrow.*", "certifi", "duckdb"]
ignore_missing_imports = true
